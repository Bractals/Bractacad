<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapicad</title>
  <link rel="icon" href="/icons/favicon/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">

  <script>
    // Hide root document element until state is restored
    // Possibly move this to a separate preload script
    document.documentElement.classList.add('preload-state');
  </script>

</head>
<body>
  <canvas id="background"></canvas>

  <button id="toggle-menu-btn" class="toggle-sidebar-btn">&#x25C0;</button>
  <div id="menu" class="menu">
    <ul>
      <!--FILE-->
      <li id="file-menu"><button class="dropdown-toggle"><u>F</u>ile</button>
        <ul class="dropdown">
          <li><button class="dropdown-toggle">New</button>
            <ul class="dropdown">
              <li><button>New project</button></li>
            </ul>
          </li>
          <li><button class="dropdown-toggle">Open</button>
            <ul class="dropdown">
              <li><button>Open project</button></li>
            </ul>
          </li>
          <li><button class="dropdown-toggle">Save</button>
            <ul class="dropdown">
              <li><button>Save</button></li>
            </ul>
          </li>
          <li><button class="dropdown-toggle">Save As</button>
            <ul class="dropdown">
              <li><button>Save</button></li>
            </ul>
          </li>
          <li><button class="dropdown-toggle">Import</button>
            <ul class="dropdown">
              <li><button>STL</button></li>
            </ul>
          </li>
          <li><button class="dropdown-toggle">Export</button>
            <ul class="dropdown">
              <li><button>STL</button></li>
            </ul>
          </li>

        </ul>
      </li>

      <!--EDIT-->
      <li><button class="dropdown-toggle"><u>E</u>dit</button>
      </li>

      <!--VIEW-->
      <li id="view-menu"><button class="dropdown-toggle"><u>V</u>iew</button>
        <ul class="dropdown">
          <li><button id="fullscreen-btn">Fullscreen</button></li>
          <li><button id="center-btn"><span class="button-label">Center</span></button></li>
        </ul>
      </li>

      <li><button class="dropdown-toggle"><u>S</u>ettings</button></li>
      <li><button class="dropdown-toggle"><u>H</u>elp</button></li>

      <li><button class="about"><u>A</u>bout</button></li>

      <li><button class="dropdown-toggle"><u>D</u>onate</button></li>
    </ul>
  </div>
  
  <button id="toggle-inspector-btn" class="toggle-sidebar-btn">&#x25B6;</button>
  <div id="inspector" class="menu">
    <div class="inspector-content">

      <div class="tab" id="toggle-tab">

        <div class="tab-header">
          <button class="toggle-tab-btn">
            <span class="arrow">
              <img src="/icons/arrow-open.svg" alt="open">
            </span>
            <span class="tab-label">Toggle</span>
          </button>
        </div>

        <div class="tab-content">
          <label id="toggle-axes-label">
            <input type="checkbox" id="toggle-axes" checked>
            <span>Axes</span>
          </label>
        </div>
      </div>

      <div class="tab" id="tools-tab">

        <div class="tab-header">
          <button class="toggle-tab-btn">
            <span class="arrow">
              <img src="/icons/arrow-open.svg" alt="open">
            </span>
            <span class="tab-label">Tools</span>
          </button>
        </div>

        <div class="tab-content">
          <div class="tool-carousel">
            <button class="tool-btn" id="line-btn">✏️</button>
            <button class="tool-btn">📏</button>
            <button class="tool-btn" id="rectangle-btn">🔲</button>
            <button class="tool-btn">🔵</button>
            <button class="tool-btn">🔵</button>
            <button class="tool-btn">🔵</button>
            <button class="tool-btn">🔵</button>
          </div>
        </div>
      </div>

      <div class="tab" id="focus-tab">

        <div class="tab-header">
          <button class="toggle-tab-btn">
            <span class="arrow">
              <img src="/icons/arrow-open.svg" alt="open">
            </span>
            <span class="tab-label">Focus</span>
          </button>
        </div>

        <div id="drawPlane-menu" class="tab-content">
          
          <h4 style="text-align: center; border-bottom: 1px dashed black; margin: 0; padding: 0.25rem;">Draw Plane</h4>
          
          <div id="drawPlane-size">
            <input type="text" id="drawPlane-length" placeholder="0 mm">
            <Span>x</Span>
            <input type="text" id="drawPlane-width" placeholder="0 mm">
          </div>

          <div>
            <span>Offset:</span>
            <input type="text" placeholder="0 mm">
          </div>

          <div>
            <span>Rotation:</span>
            <span>X</span>
            <input type="text" placeholder="0">
            <span>Y</span>
            <input type="text" placeholder="0">
            <span>Z</span>
            <input type="text" placeholder="0">
          </div>

          <div>
            <span>Extrude:</span>
            <input type="text" id="extrude-value" placeholder="+/- 0 mm">
          </div>

          <div id="boolean-options" style="display: flex; align-items: center; justify-content: center; padding: 1rem;">
            <select style="padding: 1rem; text-align: center;">
              <option value="merge">Merge</option>
              <option value="cut">Cut</option>
              <option value="wrap">Wrap</option>
            </select>
          </div>

          <div id="create-btn-wrap">
            <button id="create-btn">Create</button>
          </div>

        </div>
      </div>

      <div class="tab" id="layers-tab">

        <div class="tab-header">
          <button class="toggle-tab-btn">
            <span class="arrow">
              <img src="/icons/arrow-open.svg" alt="open">
            </span>
            <span class="tab-label">Layers</span>
          </button>
        </div>

        <div class="tab-content">

          <div id="layer-menu-wrap">
            <div id="layer-menu">
              <button id="new-layer-btn">+</button>
              <button id="delete-layer-btn">-</button>
            </div>
          </div>

          <ul id="layers">
          </ul>

        </div>
      </div>


    </div>



  </div>

  
  <div id="about-section" class="modal">
    <div class="modal-content">
      <div>
        <a href="https://bractal.com">
          <img
          id="home-icon"
          src="icons/white-butterfly.svg"
          alt="White-Butterfly"
          />
        </a>
        <button id="close-about-btn" class="close-btn">&times;</button>
        <h3 id="about-section-header">
          Rapicad
        </h3>

        <div style="padding-bottom: 20px;" >
          <span>by <a href="https://bractal.com">Bractal</a></span>
        </div>

        <div style="font-size: 10px;">
          <p><i>Version 0.3 &copy; 2025 Bractal</i></p>
          <p><i>License: GNU GPL-3.0</i></p>
        </div>

        <p style="padding-top: 20px;">
          This is a simple, free & open source CAD program for designing 3D objects.
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
